<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1920">
<title>Kid TV</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--ink:#5a3d8a;--halo:rgba(255,200,240,.9);--veil:#f3eaff}
html,body{margin:0;height:100%;overflow:hidden;background:#1c1840;color:var(--ink);font:800 36px "Baloo 2","Trebuchet MS",sans-serif}
.L{position:absolute;inset:0;opacity:0;transition:opacity 1.3s ease;overflow:hidden}.L.on{opacity:1}
.a,.pt{position:absolute}
.pt{width:var(--z);height:var(--z);border-radius:50%}
.st{background:#fff;animation:tw 5s ease-in-out infinite}
.ff{background:#fff3a0;box-shadow:0 0 18px 6px rgba(255,243,160,.6);animation:fly 14s ease-in-out infinite}
.bb{top:100%;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);animation:rise linear infinite}
.sn{top:0;background:#fff;opacity:.85;animation:fall linear infinite}
.cl{animation:dr 20s ease-in-out infinite}.un{animation:fl 8s ease-in-out infinite}
.ray{top:-10%;width:200px;height:130%;background:linear-gradient(rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:tw 9s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
@keyframes fly{0%,100%{transform:translate(0,0)}33%{transform:translate(40px,-30px)}66%{transform:translate(-30px,-50px)}}
@keyframes rise{to{transform:translateY(-120vh)}}
@keyframes fall{from{transform:translateY(-10vh)}to{transform:translateY(110vh)}}
@keyframes dr{50%{transform:translateX(60px)}}
@keyframes fl{50%{transform:translateY(-18px)}}
#car{position:absolute;inset:0;transition:opacity .45s ease,transform .6s ease}
#car.out{opacity:0;transform:scale(1.06)}
.it{position:absolute;left:50%;top:47%;width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2);
transition:transform .45s cubic-bezier(.22,.8,.3,1),opacity .45s;will-change:transform}
.in{position:absolute;inset:0}
.sel .in{animation:br 4.5s ease-in-out infinite}
@keyframes br{50%{transform:translateY(-6px) scale(1.012)}}
.halo{position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(closest-side,var(--halo),transparent 72%);opacity:0;transition:opacity .5s,transform .5s}
.lift{position:absolute;inset:8% 6% -3%;border-radius:56px;box-shadow:0 50px 80px -10px rgba(50,25,110,.45);opacity:0;transition:opacity .45s}
.sel .halo,.sel .lift{opacity:1}
.card{position:absolute;inset:0;border-radius:56px;overflow:hidden;background:var(--bg);transition:transform .5s ease;
box-shadow:0 28px 60px -22px rgba(50,25,110,.4),0 8px 18px -8px rgba(50,25,110,.25)}
.go .card{transform:scale(1.18)}.go .halo{transform:scale(1.6)}
.av{position:absolute;left:50%;top:52px;width:236px;height:236px;margin-left:-118px;border-radius:50%;object-fit:cover;border:8px solid #fff;background:#fff}
.nm{position:absolute;left:18px;right:18px;bottom:34px;text-align:center;font-size:36px;line-height:1.05;height:80px;overflow:hidden;color:#5a3d8a;display:flex;align-items:center;justify-content:center}
.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.veil{position:absolute;inset:0;background:var(--veil);opacity:0;transition:opacity .45s}
.pl{position:absolute;right:26px;top:26px;width:76px;opacity:0;transition:opacity .45s}.sel .pl{opacity:1}
#lab{position:absolute;left:160px;right:160px;bottom:7%;text-align:center;font-size:46px;line-height:1.1;max-height:110px;overflow:hidden;transition:opacity .3s}
#hint{position:absolute;right:50px;top:36px;font-size:44px;opacity:.45}
#msg{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:56px}
#load{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:34px;font-size:80px;color:#ffd86b}
#load.on{display:flex}#load i{font-style:normal;animation:tw 1.6s ease-in-out infinite}#load i:nth-child(2){animation-delay:.3s}#load i:nth-child(3){animation-delay:.6s}
#err{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:50px;background:rgba(255,255,255,.55);z-index:20}
#err.on{display:flex}#err h2{font-size:78px;margin:0}
#err .bt{background:#fff;color:#7a4fd6;font-size:56px;padding:26px 90px;border-radius:70px;box-shadow:0 30px 60px -20px rgba(50,25,110,.5),0 0 60px 10px var(--halo);animation:br 4s ease-in-out infinite}
#pk{position:absolute;left:0;right:0;bottom:0;padding:44px 0 56px;display:flex;justify-content:center;gap:34px;transform:translateY(120%);transition:transform .5s ease;z-index:15;background:linear-gradient(transparent,rgba(255,255,255,.4))}
#pk.on{transform:none}
.pi{width:210px;height:130px;border-radius:36px;border:6px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:58px;transition:transform .35s,box-shadow .35s;opacity:.8}
.pi.f{transform:scale(1.14) translateY(-10px);border-color:#fff;opacity:1;box-shadow:0 24px 40px -12px rgba(50,25,110,.5)}
.sd{background:#fff}
#p{position:fixed;inset:0;background:#000;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;z-index:30}#p.on{opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){.st,.ff,.bb,.sn,.cl,.un,.ray,.sel .in{animation:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rb" viewBox="0 0 200 100"><g fill="none" stroke-width="11"><path d="M10 100A90 90 0 0 1 190 100" stroke="#ffb3c7"/><path d="M22 100A78 78 0 0 1 178 100" stroke="#ffd3a3"/><path d="M34 100A66 66 0 0 1 166 100" stroke="#fff3a0"/><path d="M46 100A54 54 0 0 1 154 100" stroke="#b9f0c0"/><path d="M58 100A42 42 0 0 1 142 100" stroke="#b3dcff"/><path d="M70 100A30 30 0 0 1 130 100" stroke="#d3c0ff"/></g></symbol>
<symbol id="cl" viewBox="0 0 120 60"><g fill="#fff"><circle cx="35" cy="38" r="20"/><circle cx="60" cy="28" r="26"/><circle cx="88" cy="38" r="20"/><rect x="30" y="38" width="62" height="20" rx="10"/></g></symbol>
<symbol id="uni" viewBox="0 0 100 100"><circle cx="30" cy="38" r="15" fill="#ffb3d9"/><circle cx="24" cy="56" r="14" fill="#ffd3a3"/><circle cx="28" cy="73" r="13" fill="#b3dcff"/><circle cx="40" cy="86" r="11" fill="#d3c0ff"/><path d="M36 92L40 56Q42 30 62 28Q86 28 88 50Q90 62 80 66L62 66Q58 80 62 92Z" fill="#fff" stroke="#e3d6f7" stroke-width="3"/><path d="M58 30L67 3L73 31Z" fill="#ffe27a" stroke="#ffd04d" stroke-width="2"/><path d="M48 33L47 15L59 28Z" fill="#fff" stroke="#e3d6f7" stroke-width="3"/><circle cx="72" cy="46" r="3.5" fill="#5a3d8a"/><circle cx="79" cy="56" r="5" fill="#ffb3d1" opacity=".8"/></symbol>
</defs></svg>
<div class="L" id="L0"></div><div class="L" id="L1"></div>
<div id="car"></div><div id="lab"></div><div id="msg"></div><div id="hint">🎨</div>
<div id="load"><i>✦</i><i>✦</i><i>✦</i></div>
<div id="err"><h2>Oops! Let's try again 💕</h2><div class="bt">TRY AGAIN</div></div>
<div id="pk"></div>
<div id="p"><div id="yt"></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const [FB,CODE]=location.hash.slice(1).split("|").map(decodeURIComponent);
const $=id=>document.getElementById(id),esc=s=>s.replace(/</g,"&lt;");
const LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let chans=[],words=[],key="",vids=[],els=[],ci=0,homeCi=0,W=340,md="c",ui="load",pk=false,pi=0,ti=+LS.g("th")||0,snd=LS.g("snd")!=="0",ytReady=false,player=null,retry=null,back=null,layer=0;
function onYouTubeIframeAPIReady(){ytReady=true}
const api=(p,q)=>fetch(`https://www.googleapis.com/youtube/v3/${p}?${q}&key=${key}`).then(r=>r.json());
const BG=[["#ffd1e6","#ffe9d6"],["#d6e4ff","#e9dcff"],["#c9f3e6","#e2f6d3"],["#ffe3c4","#ffd1e6"],["#dcd0ff","#c9e6ff"]];

// ---------- sound ----------
let ac;function chime(f,d=.4,v=.05,t0=0){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type="sine";o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05)}catch(e){}}
const nav=()=>chime([523,587,659,784,880][ci%5],.35,.04);
const pick=()=>{chime(659,.4);chime(880,.5,.04,.12)};
const go=()=>{chime(523,.4);chime(659,.4,.04,.1);chime(784,.4,.04,.2);chime(1047,.6,.04,.3)};

// ---------- themes ----------
const R=(n,f)=>{let o="";for(let i=0;i<n;i++)o+=f(i*37%100,i*61%100,i);return o};
const CL=s=>`<svg class="a cl" viewBox="0 0 120 60" style="${s}"><use href="#cl" width="120" height="60"/></svg>`;
const RB=s=>`<svg class="a" viewBox="0 0 200 100" style="${s}"><use href="#rb" width="200" height="100"/></svg>`;
const STARS=(n,c)=>R(n,(a,b,i)=>`<i class="pt st" style="left:${a}%;top:${b*.92}%;--z:${3+i%4}px;animation-delay:${-i%7}s;${c||""}"></i>`);
const THEMES=[
{e:"🦄",g:"linear-gradient(160deg,#efe4ff,#ffe3f0 55%,#ffeedd)",ink:"#5a3d8a",halo:"rgba(255,190,235,.9)",veil:"#f3eaff",
 s:()=>RB("right:-110px;top:-60px;width:780px;opacity:.75;transform:rotate(28deg)")+RB("left:-120px;bottom:-80px;width:640px;opacity:.7;transform:rotate(-24deg)")+CL("left:62%;top:5%;width:260px;opacity:.9")+CL("left:3%;top:46%;width:200px;opacity:.8;animation-delay:6s")+CL("left:74%;top:78%;width:240px;opacity:.8;animation-delay:11s")+`<svg class="a un" viewBox="0 0 100 100" style="left:2%;bottom:3%;width:180px"><use href="#uni" width="100" height="100"/></svg>`+STARS(10,"background:#ffe08a;")},
{e:"☁️",g:"linear-gradient(180deg,#bfe0ff,#e6f3ff 60%,#fff4e6)",ink:"#4f5fa0",halo:"rgba(255,255,255,.95)",veil:"#eaf4ff",
 s:()=>`<div class="a" style="left:-10%;top:-20%;width:700px;height:700px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,240,200,.9),transparent)"></div>`+CL("left:60%;top:4%;width:300px;opacity:.9")+CL("left:-3%;top:62%;width:340px;opacity:.9;animation-delay:5s")+CL("left:78%;top:70%;width:280px;opacity:.85;animation-delay:9s")+CL("left:20%;top:-2%;width:200px;opacity:.7;animation-delay:13s")},
{e:"🌙",g:"linear-gradient(180deg,#141a4a,#2b2466 62%,#4a2f7a)",ink:"#f1e8ff",halo:"rgba(170,150,255,.65)",veil:"#10123a",dark:1,
 s:()=>STARS(30)+`<div class="a" style="right:7%;top:7%;width:150px;height:150px;border-radius:50%;background:#fff6d6;box-shadow:0 0 90px 30px rgba(255,246,214,.35)"></div>`+CL("left:-4%;top:74%;width:380px;opacity:.16")+CL("left:70%;top:80%;width:340px;opacity:.14;animation-delay:8s")},
{e:"🌲",g:"linear-gradient(180deg,#17394d,#1f5a50 70%,#2b6c4c)",ink:"#eafff0",halo:"rgba(255,240,160,.5)",veil:"#0f2a30",dark:1,
 s:()=>`<div class="a" style="left:-6%;bottom:-8%;width:380px;height:640px;border-radius:50% 50% 0 0;background:#0f3a31"></div><div class="a" style="right:-6%;bottom:-8%;width:420px;height:600px;border-radius:50% 50% 0 0;background:#0f3a31"></div>`+R(16,(a,b,i)=>`<i class="pt ff" style="left:${a}%;top:${30+b*.6}%;--z:9px;animation-delay:${-i*1.3}s"></i>`)+`<div class="a" style="left:0;right:0;bottom:0;height:30%;background:linear-gradient(transparent,rgba(200,255,230,.18))"></div>`},
{e:"🫧",g:"linear-gradient(180deg,#8fdcec,#3f93c8 55%,#214f94)",ink:"#f0fbff",halo:"rgba(190,245,255,.6)",veil:"#143a70",dark:1,
 s:()=>`<div class="a ray" style="left:12%"></div><div class="a ray" style="left:46%;animation-delay:-3s"></div><div class="a ray" style="left:78%;animation-delay:-6s"></div>`+R(14,(a,b,i)=>`<i class="pt bb" style="left:${a}%;--z:${12+i%5*8}px;animation-duration:${9+i%6}s;animation-delay:${-i*1.7}s"></i>`)+`<div class="a" style="left:-5%;bottom:-10%;width:360px;height:260px;border-radius:50%;background:#ffb4c4"></div><div class="a" style="right:-5%;bottom:-12%;width:400px;height:240px;border-radius:50%;background:#ffd0a8"></div>`},
{e:"❄️",g:"linear-gradient(180deg,#1d2b55,#3a4f86 65%,#8fa6cf)",ink:"#f2f6ff",halo:"rgba(255,225,160,.5)",veil:"#16224a",dark:1,
 s:()=>R(22,(a,b,i)=>`<i class="pt sn" style="left:${a}%;--z:${6+i%4*3}px;animation-duration:${14+i%8}s;animation-delay:${-i*1.9}s"></i>`)+R(15,(a,b,i)=>`<i class="pt st" style="left:${3+i*6.6}%;top:2.5%;--z:16px;background:${["#ffd27a","#ff9fb8","#9fd8ff","#b9f0c0"][i%4]};box-shadow:0 0 18px 6px rgba(255,220,150,.5);animation-delay:${-i*.7}s"></i>`)+`<div class="a" style="left:-10%;bottom:-24%;width:700px;height:420px;border-radius:50%;background:#eef3ff"></div><div class="a" style="right:-10%;bottom:-28%;width:760px;height:420px;border-radius:50%;background:#e4ecfb"></div>`}
];
function setTheme(i){
  ti=i;LS.s("th",i);const t=THEMES[i],r=document.documentElement.style;
  r.setProperty("--ink",t.ink);r.setProperty("--halo",t.halo);r.setProperty("--veil",t.veil);
  layer^=1;const L=$("L"+layer);L.style.background=t.g;L.innerHTML=t.s();L.classList.add("on");$("L"+(layer^1)).classList.remove("on");
}

// ---------- carousel ----------
function mount(list,mode,start){
  md=mode;W=mode==="c"?340:460;const H=mode==="c"?440:259;ci=Math.max(0,start||0);
  const car=$("car");car.style.setProperty("--w",W+"px");car.style.setProperty("--h",H+"px");
  car.innerHTML=list.map((x,i)=>`<div class="it"><div class="halo"></div><div class="in"><div class="lift"></div><div class="card" style="--bg:linear-gradient(160deg,${BG[i%5][0]},${BG[i%5][1]})">`+
   (mode==="c"?`<img class="av" src="${x.img||""}"><div class="nm">${esc(x.name)}</div>`:`<img class="th" src="${x.img}">`)+
   `<i class="veil"></i><svg class="pl" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38" fill="#fff" fill-opacity=".92"/><path d="M32 24L58 40L32 56Z" fill="#9b6bff"/></svg></div></div></div>`).join("");
  els=[...car.querySelectorAll(".it")];lay();
  requestAnimationFrame(()=>car.classList.remove("out"));
}
function lay(){
  const S=[1,.8,.6,.42,.34],g=.2*W,O=[0];
  for(let k=1;k<5;k++)O[k]=O[k-1]+W*S[k-1]/2+W*S[k]/2+g;
  els.forEach((e,i)=>{const d=i-ci,a=Math.abs(d),k=Math.min(a,4);
    e.style.transform=`translateX(${Math.sign(d)*O[k]}px) translateY(${a?0:-18}px) scale(${S[k]})`;
    e.style.opacity=a>3?0:[1,1,.9,.7][a];e.style.zIndex=10-a;
    e.classList.toggle("sel",!a);e.querySelector(".veil").style.opacity=a?Math.min(.1+.14*a,.5):0});
  $("lab").textContent=md==="v"&&vids[ci]?vids[ci].title:"";
}
const mv=n=>{const j=Math.max(0,Math.min(els.length-1,ci+n));if(j!==ci){ci=j;lay();nav()}};

// ---------- data ----------
const busy=b=>$("load").classList.toggle("on",b);
function fail(r,b){ui="err";retry=r;back=b;$("err").classList.add("on")}
const hideErr=()=>$("err").classList.remove("on");
async function init(){
  busy(true);hideErr();$("msg").textContent="";
  try{
    const c=await(await fetch(`${FB}/f/${CODE}.json`)).json();
    if(!c||!c.channels||!c.channels.length){busy(false);$("msg").textContent="🙋 Ask a grown-up to add channels!";return}
    key=c.key;chans=c.channels;words=(c.words||"").toLowerCase().split(",").map(s=>s.trim()).filter(Boolean);
    const r=await api("channels","part=snippet&id="+chans.map(x=>x.id).join(","));
    (r.items||[]).forEach(i=>{const ch=chans.find(x=>x.id===i.id);if(ch)ch.img=(i.snippet.thumbnails.high||i.snippet.thumbnails.default).url});
    busy(false);ui="home";mount(chans,"c",0);
  }catch(e){busy(false);fail(init,null)}
}
async function openChan(){
  homeCi=ci;pick();$("car").classList.add("out");busy(true);
  try{
    const r=await api("playlistItems","part=snippet&maxResults=30&playlistId=UU"+chans[ci].id.slice(2));
    const ids=(r.items||[]).map(i=>i.snippet.resourceId.videoId);
    const st=ids.length?await api("videos","part=status&id="+ids.join(",")):{items:[]};
    const ok=new Set((st.items||[]).filter(v=>v.status.embeddable&&v.status.privacyStatus==="public").map(v=>v.id));
    vids=(r.items||[]).map(i=>({id:i.snippet.resourceId.videoId,title:i.snippet.title,img:(i.snippet.thumbnails.medium||i.snippet.thumbnails.default||{}).url}))
      .filter(v=>ok.has(v.id)&&v.img&&!words.some(w=>v.title.toLowerCase().includes(w)));
    busy(false);ui="chan";
    if(!vids.length){els=[];$("car").innerHTML="";$("msg").textContent="🙈 Nothing here yet";$("car").classList.remove("out");return}
    mount(vids,"v",0);
  }catch(e){busy(false);fail(openChan,goHome)}
}
function goHome(){
  hideErr();$("msg").textContent="";$("lab").textContent="";$("car").classList.add("out");
  setTimeout(()=>{ui="home";mount(chans,"c",homeCi)},350);
}

// ---------- playback ----------
function play(){
  if(!ytReady||!vids[ci])return;
  ui="play";go();els[ci].classList.add("go");$("car").classList.add("out");$("lab").style.opacity=0;
  setTimeout(()=>{
    $("p").classList.add("on");const id=vids[ci].id;
    if(player&&player.loadVideoById)player.loadVideoById(id);
    else player=new YT.Player("yt",{width:"100%",height:"100%",videoId:id,playerVars:{autoplay:1,rel:0,origin:location.origin},events:{onStateChange:e=>{if(e.data===0)stop()},onError:e=>oops(e.data)}});
  },520);
}
function stop(){
  if(player&&player.stopVideo)player.stopVideo();
  $("p").classList.remove("on");if(els[ci])els[ci].classList.remove("go");
  $("car").classList.remove("out");$("lab").style.opacity=1;ui="chan";lay();
}
function oops(code){
  stop();const bad=[100,101,150].includes(code);
  fail(()=>{hideErr();ui="chan";if(bad){vids.splice(ci,1);if(vids.length)mount(vids,"v",Math.min(ci,vids.length-1));else goHome()}else play()},()=>{hideErr();ui="chan"});
}

// ---------- picker ----------
function drawPk(){$("pk").innerHTML=THEMES.map((t,i)=>`<div class="pi${i===pi?" f":""}" style="background:${t.g}">${t.e}</div>`).join("")+`<div class="pi sd${pi===THEMES.length?" f":""}">${snd?"🔔":"🔕"}</div>`}
const openPk=()=>{pk=true;pi=ti;drawPk();$("pk").classList.add("on")};
const closePk=()=>{pk=false;$("pk").classList.remove("on")};

// ---------- remote ----------
document.addEventListener("keydown",e=>{
  const k=e.keyCode;
  if(k===461||k===8||k===27){
    if(pk)closePk();else if(ui==="play")stop();else if(ui==="err"){hideErr();if(back)back()}else if(ui==="chan")goHome();else return;
    e.preventDefault();return}
  if(ui==="play"||ui==="load")return;
  if(ui==="err"){if(k===13&&retry)retry();return}
  if(pk){
    if(k===37||k===39){pi=Math.max(0,Math.min(THEMES.length,pi+(k===39?1:-1)));if(pi<THEMES.length)setTheme(pi);chime(660+pi*60,.35,.04);drawPk()}
    else if(k===13){if(pi===THEMES.length){snd=!snd;LS.s("snd",snd?"1":"0");drawPk();chime(784)}else closePk()}
    else if(k===40||k===38)closePk();
    return}
  if(k===37)mv(-1);else if(k===39)mv(1);
  else if(k===13){if(ui==="home")openChan();else if(ui==="chan")play()}
  else if(k===38)openPk();
});
setTheme(ti);init();
</script></body></html>
