  const ok=new Map(),b=[];for(let i=0;i<ids.length;i+=50)b.push(ids.slice(i,i+50));
  const rs=await Promise.all(b.map(x=>api("videos","part=status,contentDetails&fields=items(id,status(embeddable,privacyStatus),contentDetails/duration)&id="+x.join(","))));
  rs.forEach(r=>(r.items||[]).forEach(v=>{if(v.status.embeddable&&v.status.privacyStatus==="public")ok.set(v.id,pdur(v.contentDetails&&v.contentDetails.duration))}));
  return ok}
function getVids(c){
  if(VC[c.id])return VC[c.id];
  const ck="vc:"+c.id,h=jget(ck);
  if(h&&Date.now()-h.t<18e5)return VC[c.id]=Promise.resolve(h.v.filter(v=>!blocked(v.title)));
  return VC[c.id]=(async()=>{
    const r=await api("playlistItems","part=snippet&maxResults=30&fields=items(snippet(title,resourceId/videoId,thumbnails(medium,default)))&playlistId=UU"+c.id.slice(2));
    const its=(r.items||[]).map(i=>({id:i.snippet.resourceId.videoId,title:i.snippet.title,img:(i.snippet.thumbnails.medium||i.snippet.thumbnails.default||{}).url}));
    const ok=await okIds(its.map(v=>v.id));
    const v=its.filter(v=>ok.has(v.id)&&v.img).map(v=>(v.dur=ok.get(v.id)||0,v));
    jset(ck,{t:Date.now(),v});return v.filter(x=>!blocked(x.title));
  })().catch(e=>{delete VC[c.id];if(h)return h.v.filter(v=>!blocked(v.title));throw e});
}
async function getRecs(){
  const ck="rec3:"+recWords.join("|");
  try{const c=JSON.parse(LS.g(ck)||"null");if(c&&Date.now()-c.t<216e5)return c.v}catch(e){}
  const pa=new Date(Date.now()-180*864e5).toISOString();
  const out=[],seen=new Set();
  const RS=await Promise.all(recWords.slice(0,6).map(w=>api("search","part=snippet&type=video&videoEmbeddable=true&safeSearch=strict&maxResults=15&publishedAfter="+encodeURIComponent(pa)+"&q="+encodeURIComponent(w))));
  for(const r of RS){
    if(r.error)throw new Error(r.error.message);
    (r.items||[]).forEach(i=>{const t=dec(i.snippet.title);
      if(i.id&&i.id.videoId&&!seen.has(i.id.videoId)&&recWords.some(k=>t.toLowerCase().includes(k))&&!blocked(t+" "+dec(i.snippet.channelTitle))){seen.add(i.id.videoId);out.push({id:i.id.videoId,title:t,img:(i.snippet.thumbnails.medium||i.snippet.thumbnails.default||{}).url,t:i.snippet.publishedAt||""})}});
  }
  const ok=await okIds(out.map(v=>v.id));
  const v=out.filter(x=>ok.has(x.id)&&x.img).map(x=>(x.dur=ok.get(x.id)||0,x)).sort((a,b)=>b.t.localeCompare(a.t));
  LS.s(ck,JSON.stringify({t:Date.now(),v}));return v;
}
async function allVids(){
  const [a,b]=await Promise.all([Promise.all(chans.map(getVids)),recWords.length?getRecs().catch(()=>[]):[]]);
  let v=a.flat().concat(b);
  const seen=new Set();return shuf(v.filter(x=>!seen.has(x.id)&&seen.add(x.id))).slice(0,80);
}
async function openChan(){
  homeCi=ci;pick();$("car").classList.add("out");busy(true);
  const t=tiles[ci];rnd=t.type==="rand";
  try{
    vids=t.type==="ch"?await getVids(t):t.type==="rec"?await getRecs():await allVids();
    busy(false);ui="chan";
    if(!vids.length){els=[];$("car").innerHTML="";$("msg").textContent="🙈 Nothing here yet";$("car").classList.remove("out");return}
    mount(vids,"v",0);
  }catch(e){busy(false);fail(openChan,goHome)}
}
function ended(){if(rnd&&ci<vids.length-1){ci++;lay();player.loadVideoById(vids[ci].id)}else stop()}
function goHome(){
  hideErr();$("msg").textContent="";$("lab").textContent="";$("car").classList.add("out");
  setTimeout(()=>{ui="home";mount(tiles,"c",homeCi)},350);
}

// ---------- playback ----------
function play(){
  if(!ytReady||!vids[ci])return;
  ui="play";go();els[ci].classList.add("go");$("car").classList.add("out");$("lab").style.opacity=0;
  setTimeout(()=>{
    $("p").classList.add("on");const id=vids[ci].id;
    if(player&&player.loadVideoById)player.loadVideoById(id);
    else player=new YT.Player("yt",{width:"100%",height:"100%",videoId:id,playerVars:{autoplay:1,rel:0,controls:0,disablekb:1,fs:0,iv_load_policy:3,playsinline:1,origin:location.origin},events:{onReady:e=>{try{e.target.getIframe().setAttribute("tabindex","-1")}catch(x){}window.focus()},onStateChange:e=>{if(e.data===0)ended();else if(e.data===1)showBar(3000);else if(e.data===2)showBar(1e9)},onError:e=>oops(e.data)}});
  },350);
}
function stop(){
  if(adf)exitAd();$("pb").classList.remove("on");$("ab").classList.remove("on");if(wasAd){wasAd=false;try{if(!wasMuted)player.unMute()}catch(x){}}
  if(player&&player.stopVideo)player.stopVideo();
  $("p").classList.remove("on");els.forEach(x=>x.classList.remove("go"));
  $("car").classList.remove("out");$("lab").style.opacity=1;ui="chan";lay();
}
function oops(code){
  stop();const bad=[100,101,150].includes(code);
  fail(()=>{hideErr();ui="chan";if(bad){vids.splice(ci,1);if(vids.length)mount(vids,"v",Math.min(ci,vids.length-1));else goHome()}else play()},()=>{hideErr();ui="chan"});
}

// ---------- progress bar & ads ----------
const fmt=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const showBar=(ms=4000)=>{pbUntil=Date.now()+ms;if(!adf)$("pb").classList.add("on")};
function inAd(){try{const e=vids[ci]&&vids[ci].dur,d=player.getDuration();return e>0&&d>0&&Math.abs(d-e)>3}catch(x){return false}}
function enterAd(){if(!player||!player.getIframe)return;adf=true;$("p").classList.add("ad");$("pb").classList.remove("on");
  try{const f=player.getIframe();f.setAttribute("tabindex","0");f.focus()}catch(x){}}
function exitAd(){adf=false;$("p").classList.remove("ad");
  try{const f=player.getIframe();f.setAttribute("tabindex","-1");f.blur()}catch(x){}window.focus()}
let wasAd=false,wasMuted=false;
function reloadVid(){try{player.loadVideoById(vids[ci].id)}catch(x){}}
setInterval(()=>{
  const ab=$("ab");
  if(ui!=="play"||!player||!player.getCurrentTime||!$("p").classList.contains("on")){ab.classList.remove("on");return}
  const ad=inAd();
  if(ad&&!wasAd){wasAd=true;try{wasMuted=player.isMuted();player.mute()}catch(x){}}
  if(!ad&&wasAd){wasAd=false;try{if(!wasMuted)player.unMute()}catch(x){}if(adf)exitAd()}
  ab.classList.toggle("on",ad);$("p").classList.toggle("ad",ad||adf);
  const d=player.getDuration()||0,t=seekT!=null?seekT:player.getCurrentTime()||0;
  if(ad){$("abc").textContent="Ad ends in "+Math.max(0,Math.ceil(d-t))+"s";$("abb").style.opacity=adf?.6:1;$("abb").textContent=adf?"Select Skip below ▼":"▼ SKIP AD"}
  $("pb").classList.toggle("on",!ad&&Date.now()<pbUntil&&!adf);
  $("pbf").style.width=(d?Math.min(100,t/d*100):0)+"%";$("pbc").textContent=fmt(t);$("pbd").textContent=fmt(d);
  $("pbi").textContent=player.getPlayerState()===2?"⏸":"▶";
},250);

// ---------- picker ----------
function drawPk(){
  let tr=$("pkt");
  if(!tr){$("pk").innerHTML='<div id="pkt">'+THEMES.map(x=>`<div class="pi" style="background:${x.g}">${x.e}</div>`).join("")+'<div class="pi sd"></div></div>';tr=$("pkt")}
  [...tr.children].forEach((c,i)=>c.classList.toggle("f",i===pi));
  tr.lastChild.textContent=snd?"🔔":"🔕";
  tr.style.transform=`translateX(${960-105-pi*244}px)`;
}
const openPk=()=>{pk=true;pi=ti;drawPk();$("pk").classList.add("on")};
const closePk=()=>{pk=false;$("pk").classList.remove("on")};

// ---------- remote ----------
document.addEventListener("keydown",e=>{
  const k=e.keyCode;
  if(k===461||k===8||k===27){
    if(atRoot())return;
    backAct();e.preventDefault();return}
  if(ui==="play"){
    if(player&&player.getPlayerState){
      if(k>=37&&k<=40)e.preventDefault();
      if([13,415,19,179].includes(k)){player.getPlayerState()===1?player.pauseVideo():player.playVideo();showBar(3000);e.preventDefault()}
      else if(k===39||k===417||k===37||k===412){
        const base=seekT!=null?seekT:player.getCurrentTime(),d=player.getDuration()||1e9;
        seekT=Math.max(0,Math.min(d-1,base+((k===39||k===417)?10:-10)));player.seekTo(seekT,true);showBar(3500);
        clearTimeout(seekTm);seekTm=setTimeout(()=>{seekT=null},1200)}
      else if(k===40)enterAd();
      else if(k===38){if(inAd())reloadVid();else showBar(4000)}
      else if(k===413)stop();
    }
    return}
  if(ui==="load")return;
  if(ui==="err"){if(k===13&&retry)retry();return}
  if(pk){
    if(k===37||k===39){pi=Math.max(0,Math.min(THEMES.length,pi+(k===39?1:-1)));if(pi<THEMES.length)setTheme(pi);chime(660+pi*60,.35,.04);drawPk()}
    else if(k===13){if(pi===THEMES.length){snd=!snd;LS.s("snd",snd?"1":"0");drawPk();chime(784)}else closePk()}
    else if(k===40||k===38)closePk();
    return}
  if(k===37)mv(-1);else if(k===39)mv(1);
  else if(k===13){if(ui==="home")openChan();else if(ui==="chan")play()}
  else if(k===38)openPk();
});
const atRoot=()=>!pk&&(ui==="home"||ui==="load"||(ui==="err"&&!back));
function backAct(){
  if(pk)closePk();else if(adf)exitAd();else if(ui==="play")stop();else if(ui==="err"){hideErr();if(back)back()}else if(ui==="chan")goHome();
}
history.pushState({k:1},"");
window.addEventListener("popstate",()=>{
  if(atRoot()){try{window.close()}catch(x){}return}
  history.pushState({k:1},"");backAct();
});
setInterval(()=>{const a=document.activeElement;if(ui==="play"&&!adf&&a&&a.tagName==="IFRAME"){a.blur();window.focus()}},400);
{const ys=document.createElement("script");ys.src="https://www.youtube.com/iframe_api";ys.async=true;document.head.appendChild(ys)}
setTheme(ti);init();
</script></body></html>
